name: Warm Sitemap Cache

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  warm-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Request sitemap (1st)
        run: curl --fail --show-error --silent --max-time 120 https://ozi.in/sitemap-products.xml -o /dev/null

      - name: Wait 5 seconds
        run: sleep 5

      - name: Request sitemap (2nd)
        run: curl --fail --show-error --silent --max-time 120 https://ozi.in/sitemap-products.xml -o /dev/null
