name: Warm Sitemap Cache

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  warm-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Request sitemap (1st)
        run: |
          curl --fail --show-error --silent --max-time 120 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               -w "HTTP %{http_code}  time %{time_total}s\n" \
               https://ozi.in/sitemap-products.xml -o /dev/null

      - name: Wait 5 seconds
        run: sleep 5

      - name: Request sitemap (2nd)
        run: |
          curl --fail --show-error --silent --max-time 120 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               -w "HTTP %{http_code}  time %{time_total}s\n" \
               https://ozi.in/sitemap-products.xml -o /dev/null
