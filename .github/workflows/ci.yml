name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # package-lock.json was generated on Windows, and per npm/cli#4828 a
      # cross-platform lockfile can simply omit the Linux-specific optional
      # binary (@rollup/rollup-linux-x64-gnu) entirely — so even `npm install`
      # against the committed lockfile can't resolve it. Dropping the lockfile
      # for this CI-only install forces a fresh, platform-correct resolution;
      # it never touches the committed file.
      - run: rm -f package-lock.json && npm install

      - name: Type-check every workspace
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        # gateway/workers each spin up their own throwaway Postgres/Redis/OpenSearch
        # containers via `docker run` (see apps/gateway/test/setup/globalSetup.ts) —
        # ubuntu-latest runners ship Docker pre-installed, so no extra services needed.
        run: npm test
