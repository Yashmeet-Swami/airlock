name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # npm ci fails here with "Cannot find module @rollup/rollup-linux-x64-gnu"
      # (npm/cli#4828 — optional-dependency resolution breaks when the lockfile
      # was generated on a different OS than the CI runner). npm install
      # re-resolves platform-specific optional deps correctly.
      - run: npm install

      - name: Type-check every workspace
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        # gateway/workers each spin up their own throwaway Postgres/Redis/OpenSearch
        # containers via `docker run` (see apps/gateway/test/setup/globalSetup.ts) —
        # ubuntu-latest runners ship Docker pre-installed, so no extra services needed.
        run: npm test
