services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airlock
      POSTGRES_PASSWORD: airlock
      POSTGRES_DB: airlock
    ports:
      - "5432:5432"
    volumes:
      - airlock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airlock -d airlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # host 6380 to avoid clashing with any other local Redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  mock-upstream:
    build:
      context: ../..
      dockerfile: apps/mock-upstream/Dockerfile
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"

  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: ""
      DATABASE_URL: postgres://airlock:airlock@postgres:5432/airlock
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      PROXY_UPSTREAM_TIMEOUT_MS: "5000"
      RATE_LIMIT_FALLBACK_LIMIT: "60"
      RATE_LIMIT_FALLBACK_WINDOW_S: "60"
      OPENSEARCH_URL: http://opensearch:9200
      CIRCUIT_BREAKER_WINDOW_SIZE: "20"
      CIRCUIT_BREAKER_FAILURE_THRESHOLD_PCT: "50"
      CIRCUIT_BREAKER_COOLDOWN_MS: "30000"
      PROXY_MAX_RETRIES: "2"
      PROXY_RETRY_BASE_MS: "100"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/liveness"]
      interval: 5s
      timeout: 5s
      retries: 10

  workers:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://airlock:airlock@postgres:5432/airlock
      REDIS_URL: redis://redis:6379
      WEBHOOK_DELIVERY_TIMEOUT_MS: "5000"
      WEBHOOK_CONCURRENCY: "5"
      WEBHOOK_MAX_ATTEMPTS: "5"
      WEBHOOK_BACKOFF_MS: "1000,5000,30000,120000,600000"
      OPENSEARCH_URL: http://opensearch:9200
      LOG_INDEXER_CONCURRENCY: "10"
      METRICS_PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      # Gateway owns running migrations on startup; its healthcheck only passes
      # once that's done, which is the signal workers needs that the schema is ready.
      gateway:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://gateway:3000
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

volumes:
  airlock_pgdata:
